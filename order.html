<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt bàn - Nhà hàng KAN</title>
    <meta name="description" content="Đặt bàn tại Nhà hàng KAN - Giao diện giống trang chủ, không dùng JS và không dùng SQL.">
    <link rel="icon" type="image/x-icon" href="Favicon.ico">
    <link rel="apple-touch-icon" href="image/logo-Photoroom.png">
    <link rel="stylesheet" href="style.css">
    
    </head>
<body class="order-page">
    <header class="home-header">
        <div class="logo">
            <img src="image/logo-Photoroom.png" alt="Logo Nhà hàng KAN">
        </div>
        <h1>🍜 Nhà hàng KAN 🍜</h1>
        <p>✨ Hương vị chính hiệu xứ Chùa ✨</p>
    </header>
    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="menu.html">Thực đơn</a>
        <a href="about.html">Về chúng tôi</a>
        <a href="contact.html">Liên hệ</a>
        <a href="order.html">Đặt bàn</a>
        <a href="shopping.html">Giỏ hàng</a>
        <a href="taikhoan.html">Tài khoản</a>
    </nav>

    <div class="container">
        <section class="section booking-container">
            <h2>Đặt bàn tại Nhà hàng KAN</h2>
            <p>Vui lòng điền thông tin bên dưới.</p>

            <!-- Form gửi email qua mailto: - không sử dụng JS/SQL -->
            <form method="post" action="mailto:orders@example.com" enctype="text/plain">
                <div class="booking-grid">
                    <div>
                        <label for="fullname">Họ & Tên</label>
                        <input type="text" id="fullname" name="Họ & Tên" required>
                    </div>
                    <div>
                        <label for="phone">Số điện thoại</label>
                        <input type="tel" id="phone" name="Số điện thoại" required>
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="Email">
                    </div>
                    <div>
                        <label for="guests">Số khách</label>
                        <input type="number" id="guests" name="Số khách" min="1" value="2" required>
                    </div>
                    <div>
                        <label for="date">Ngày</label>
                        <input type="date" id="date" name="Ngày" required>
                    </div>
                    <div>
                        <label for="time">Giờ</label>
                        <input type="time" id="time" name="Giờ" required>
                    </div>
                    <div class="full">
                        <label for="area">Khu vực mong muốn</label>
                        <select id="area" name="Khu vực">
                            <option value="Bên trong">Bên trong</option>
                            <option value="Ban công">Ban công</option>
                            <option value="Sân vườn">Sân vườn</option>
                        </select>
                    </div>
                    <div class="full">
                        <label for="requests">Yêu cầu khác / Ghi chú</label>
                        <textarea id="requests" name="Ghi chú" rows="4"></textarea>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit">Gửi yêu cầu đặt bàn</button>
                </div>
            </form>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Nhà hàng KAN. Tất cả quyền được bảo lưu.</p>
        </footer>
        <script src="shoping.js"></script>
    </body>
    </html>
